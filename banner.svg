<svg width="900" height="150" viewBox="0 0 900 150"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    text {
      font-family: monospace;
      fill: #B26CFF;
    }

    .letter {
      opacity: 0;
      animation: appear 0.35s ease forwards;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateX(20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>

  <!-- Nome -->
  <text
    x="50%"
    y="58"
    text-anchor="middle"
    font-size="38">

    <tspan class="letter" style="animation-delay: 0s">P</tspan><tspan class="letter" style="animation-delay: .08s">e</tspan><tspan class="letter" style="animation-delay: .16s">d</tspan><tspan class="letter" style="animation-delay: .24s">r</tspan><tspan class="letter" style="animation-delay: .32s">o</tspan><tspan class="letter" style="animation-delay: .40s"> </tspan><tspan class="letter" style="animation-delay: .48s">F</tspan><tspan class="letter" style="animation-delay: .56s">e</tspan><tspan class="letter" style="animation-delay: .64s">r</tspan><tspan class="letter" style="animation-delay: .72s">r</tspan><tspan class="letter" style="animation-delay: .80s">e</tspan><tspan class="letter" style="animation-delay: .88s">i</tspan><tspan class="letter" style="animation-delay: .96s">r</tspan><tspan class="letter" style="animation-delay: 1.04s">a</tspan>
  </text>

  <!-- Profissão -->
  <text
    x="50%"
    y="105"
    text-anchor="middle"
    font-size="23">

    <tspan class="letter" style="animation-delay: 1.20s">D</tspan><tspan class="letter" style="animation-delay: 1.26s">e</tspan><tspan class="letter" style="animation-delay: 1.32s">s</tspan><tspan class="letter" style="animation-delay: 1.38s">e</tspan><tspan class="letter" style="animation-delay: 1.44s">n</tspan><tspan class="letter" style="animation-delay: 1.50s">v</tspan><tspan class="letter" style="animation-delay: 1.56s">o</tspan><tspan class="letter" style="animation-delay: 1.62s">l</tspan><tspan class="letter" style="animation-delay: 1.68s">v</tspan><tspan class="letter" style="animation-delay: 1.74s">e</tspan><tspan class="letter" style="animation-delay: 1.80s">d</tspan><tspan class="letter" style="animation-delay: 1.86s">o</tspan><tspan class="letter" style="animation-delay: 1.92s">r</tspan><tspan class="letter" style="animation-delay: 1.98s"> </tspan><tspan class="letter" style="animation-delay: 2.04s">F</tspan><tspan class="letter" style="animation-delay: 2.10s">r</tspan><tspan class="letter" style="animation-delay: 2.16s">o</tspan><tspan class="letter" style="animation-delay: 2.22s">n</tspan><tspan class="letter" style="animation-delay: 2.28s">t</tspan><tspan class="letter" style="animation-delay: 2.34s">-</tspan><tspan class="letter" style="animation-delay: 2.40s">E</tspan><tspan class="letter" style="animation-delay: 2.46s">n</tspan><tspan class="letter" style="animation-delay: 2.52s">d</tspan>
  </text>

</svg>
